# dsh-tool-cost-hint 的 bundle patch 文件。
#
# 这个文件同时服务两种用法，两种用法的语义完全一致（都是"patch 列表"，顶层是 YAML 数组）：
#
#   1) bundle 自动挂载（正式用法）
#      package.json 里写 "dsh": { "bundle": { "patch": "./cordis.patch.yml" } }，
#      只要本包被列进 profile package.json 的 dsh.profile.bundles，loader 就会在启动时
#      自动应用本文件，把下面这条 entry INSERT 进 host 组合。用户不需要手改 profile。
#
#   2) 临时覆盖（本轮 host 侧验证用法）
#      dsh --profile desktop --patch ./cordis.patch.yml
#      `--patch <path>` 是 launcher 级参数，可重复（--patch a.yml --patch b.yml），
#      语义是"在 profile 层之后再叠一层 patch"，不污染 profile 目录里的文件。
#      注意：--patch 是单值收集器，不是变长参数，别把 app 参数塞在它后面。
#
# 【为什么用 insert 而不是直接写 id】
# patch 算法只认识"按 id 命中已有行"和"insert 新行"两类操作。本插件是新增行，
# 必须走 insert；用 `- id: tool-cost-hint` 单独成行会被当成"修改不存在的行"。
#
# 【config 是整体替换而不是深合并】
# patch 命中某个已有 row 的 config 时，是**整体替换**（不深合并），所以如果要在这里
# 改 config，必须把所有想保留的默认值都重述一遍。下面 insert 的是新行，没有这个问题，
# 但只要以后改成 `- id: tool-cost-hint / config:` 的形式，就必须写全。
#
# 所有 config 字段都可以删掉（删掉即用插件里 Config schema 的 default）。
# 这里显式写出来，是为了让用户一眼看到有哪些旋钮可以拧。

- insert:
    - id: tool-cost-hint
      name: dsh-tool-cost-hint
      config:
        # 轮次结束时 ctx.emit 一条 'tool-cost-hint/summary' 事件（下一轮 UI 的取数口）。
        emitEvent: true
        # 把每轮摘要以单行 JSON 打到 stderr。默认关，验证时打开。
        logToConsole: false
        # 每个会话在内存里保留最近多少轮摘要（给下一轮 UI 回看用）。0 = 不保留历史。
        keepTurns: 20
        # 不计入统计的工具名黑名单，例如 ['tool_cost_hint_dump']。
        excludeTools: []
